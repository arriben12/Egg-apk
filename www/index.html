<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Servidores Steal an Egg</title>
<style>
:root{--bg:#0d0a17;--card:#1a1430;--line:#2e2452;--gold:#f5c542;--pur:#8b5cf6;--tx:#ece8f7;--mu:#9a90b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d1440,var(--bg));color:var(--tx);font:15px system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;background:#0d0a17ee;backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 8px;font-size:20px;color:var(--gold)}h1 span{color:var(--pur)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,button{background:#120e24;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}input{flex:1;min-width:110px}
.mu{color:var(--mu)}main{max-width:900px;margin:auto;padding:12px;display:grid;gap:10px}
@media(min-width:700px){main{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.best{border-color:var(--gold);box-shadow:0 0 16px #f5c54240}
.card h3{margin:0 0 6px;display:flex;justify-content:space-between}.tag{padding:2px 10px;border-radius:99px;border:1px solid var(--pur);color:#c4b0ff;font-size:13px}
.join{display:block;width:100%;margin-top:10px;padding:14px;font-weight:800;font-size:16px;border:0;border-radius:12px;color:#1a1200;background:linear-gradient(90deg,var(--gold),#ffdf7a);cursor:pointer}
.join:active{transform:scale(.98)}.notice{border-left:4px solid var(--gold);background:#241b45;padding:10px;border-radius:8px;font-size:13px}
</style></head><body>
<header><h1>🥚 Steal an Egg <span>Servidores</span></h1>
<div class="row"><input id="gid" inputmode="numeric" placeholder="Place ID o Universe ID"><button id="go">Cargar</button></div>
<div class="row"><input id="max" type="number" min="1" placeholder="Máx. jugadores"><input id="q" placeholder="Buscar ID de servidor">
<span id="info" class="mu" style="align-self:center;font-size:13px">—</span></div></header>
<main id="list"></main>
<script>
const $=id=>document.getElementById(id),LS=localStorage;let d=null,err='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('gid').value=LS.gid||'';$('go').onclick=()=>{LS.gid=$('gid').value.trim();load()};$('max').oninput=$('q').oninput=render;
function render(){const L=$('list');let h='';if(err)h+=`<div class="notice full">⚠️ ${esc(err)}</div>`;
 if(!d){L.innerHTML=h||'<div class="notice full">Cargando…</div>';return}
 if(d.partial)h+='<div class="notice full">Lista parcial: Roblox limitó las peticiones o hay demasiados servidores. Los de menos jugadores salen primero.</div>';
 const m=+$('max').value,q=$('q').value.trim().toLowerCase();
 const s=d.servers.filter(x=>(!m||x.playing<=m)&&(!q||x.id.toLowerCase().includes(q)));
 $('info').textContent=`${s.length}/${d.total} servidores · ${new Date(d.fetchedAt).toLocaleTimeString()}`;
 s.forEach((x,i)=>{h+=`<div class="card ${i<3?'best':''}"><h3>${i<3?'⭐ ':''}Servidor ${esc(x.id.slice(0,8))}…<span class="tag">${x.playing}/${x.maxPlayers}</span></h3>
 <div class="mu">Ping ${x.ping??'?'} ms · FPS ${x.fps?Math.round(x.fps):'?'}</div>
 <button class="join" onclick="joinGame('${d.placeId}','${esc(x.id)}')">UNIRSE AL SERVIDOR</button></div>`});
 if(!s.length)h+='<div class="card full mu">Ningún servidor coincide.</div>';L.innerHTML=h}
const DEFAULT_ID='107778070777162';
async function jget(u){const r=await fetch(u,{headers:{accept:'application/json'}});if(r.status===429){const e=new Error('Roblox limita las peticiones (429)');e.rate=true;throw e}if(!r.ok)throw new Error('Roblox respondió '+r.status);return r.json()}
async function resolveId(id){try{const u=await jget('https://games.roblox.com/v1/games?universeIds='+id);if(u.data&&u.data[0])return String(u.data[0].rootPlaceId)}catch(e){if(e.rate)throw e}return String(id)}
async function build(id){const placeId=await resolveId(id);let servers=[],cursor='',pages=0,partial=false;
 try{do{const x=await jget('https://games.roblox.com/v1/games/'+placeId+'/servers/Public?sortOrder=Asc&limit=100'+(cursor?'&cursor='+encodeURIComponent(cursor):''));
  servers=servers.concat((x.data||[]).map(s=>({id:s.id,playing:s.playing,maxPlayers:s.maxPlayers,ping:s.ping??null,fps:s.fps??null})));cursor=x.nextPageCursor;pages++}while(cursor&&pages<15);if(cursor)partial=true}
 catch(e){if(!e.rate||!servers.length)throw e;partial=true}
 servers.sort((a,b)=>a.playing-b.playing);return{fetchedAt:Date.now(),placeId,total:servers.length,partial,servers}}
function joinGame(p,i){location.href='roblox://experiences/start?placeId='+p+'&gameInstanceId='+i}
async function load(){const id=(LS.gid||DEFAULT_ID).trim();try{if(!/^\d{5,20}$/.test(id))throw new Error('ID no válido');d=await build(id);err=''}catch(e){err=e.message}render()}
load();setInterval(load,20000);
</script></body></html>
